apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: traefik
spec:
  plugin:
    crowdsec-bouncer:
      enabled: true
      crowdsecMode: stream
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      crowdsecLapiKeyFile: /etc/traefik/crowdsec/lapi-key
      updateIntervalSeconds: 30
      # Availability over enforcement when LAPI is down: keep serving from the
      # last synced cache instead of blocking every request on every route
      # (ArgoCD and Authentik included). The router blocklist still applies.
      updateMaxFailure: -1
      streamStartupBlock: false
      # LAN, VPN overlay, pods and Casa are never checked.
      clientTrustedIPs:
        - 10.0.0.0/8
        - 192.168.0.0/16

kube-prometheus-stack:
  grafana:
    admin:
      existingSecret: grafana-admin-creds
      userKey: admin-user
      passwordKey: admin-password
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-auth@kubernetescrd
      hosts:
        - grafana.ruddenchaux.xyz
      tls:
        - secretName: grafana-tls
          hosts:
            - grafana.ruddenchaux.xyz
    envFromSecrets:
      - name: grafana-oidc
    grafana.ini:
      server:
        root_url: https://grafana.ruddenchaux.xyz
      auth.generic_oauth:
        enabled: true
        name: Authentik
        scopes: openid profile email
        auth_url: https://auth.ruddenchaux.xyz/application/o/authorize/
        token_url: https://auth.ruddenchaux.xyz/application/o/token/
        api_url: https://auth.ruddenchaux.xyz/application/o/userinfo/
        role_attribute_path: "contains(groups[*], 'admin') && 'Admin' || 'Viewer'"
        allow_assign_grafana_admin: true
      auth:
        signout_redirect_url: https://auth.ruddenchaux.xyz/application/o/grafana/end-session/
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.loki.svc:3100
        access: proxy
        isDefault: false
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: local-path
    initChownData:
      securityContext:
        capabilities:
          add:
            - CHOWN
            - DAC_OVERRIDE
          drop:
            - ALL
        runAsNonRoot: false
        runAsUser: 0
  prometheusOperator:
    admissionWebhooks:
      certManager:
        enabled: true
  prometheus:
    prometheusSpec:
      retention: 15d
      # Proxmox host node_exporter (ansible/playbooks/proxmox-node-exporter.yml),
      # including zpool capacity/health from its textfile collector.
      additionalScrapeConfigs:
        - job_name: proxmox
          static_configs:
            - targets: ["10.10.0.2:9100"]
              labels:
                instance: pve01
  alertmanager:
    alertmanagerSpec:
      # Created by ansible/playbooks/alertmanager-secrets.yml from the Bottega
      # SOPS file; mounted at /etc/alertmanager/secrets/<name>/.
      secrets:
        - alertmanager-telegram
    # Merged over the chart default config; route.routes and receivers are
    # lists, so they replace the defaults and are restated in full.
    config:
      route:
        receiver: telegram
        routes:
          - receiver: "null"
            matchers:
              - alertname = "Watchdog"
          - receiver: "null"
            matchers:
              - alertname = "InfoInhibitor"
      receivers:
        - name: "null"
        - name: telegram
          telegram_configs:
            - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot_token
              # prometheus-operator v0.88 rejects chat_id_file; the ID alone
              # can't send anything without the bot token.
              chat_id: 776709656
              send_resolved: true
  prometheus-node-exporter:
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    extraHostVolumeMounts:
      - name: textfile-collector
        hostPath: /var/lib/node_exporter/textfile_collector
        mountPath: /var/lib/node_exporter/textfile_collector
        readOnly: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pvc-usage-exporter-script
  namespace: monitoring
data:
  pvc-usage.sh: |
    #!/bin/sh
    set -eu
    while true; do
      OUT=/textfile/pvc_usage_bytes.prom.tmp
      : > "$OUT"
      for d in /data/local-path-provisioner/pvc-*/; do
        base=$(basename "$d")
        ns=$(echo "$base" | cut -d'_' -f2)
        pvc=$(echo "$base" | cut -d'_' -f3-)
        if [ -z "$ns" ] || [ -z "$pvc" ]; then
          continue
        fi
        bytes=$(du -sb "$d" 2>/dev/null | awk '{print $1}')
        echo "pvc_usage_bytes{namespace=\"$ns\",pvc=\"$pvc\"} $bytes" >> "$OUT"
      done
      mv "$OUT" /textfile/pvc_usage_bytes.prom
      sleep 300
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pvc-usage-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pvc-usage-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pvc-usage-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pvc-usage-exporter
    spec:
      containers:
        - name: pvc-usage-exporter
          image: busybox:1.36
          command: ["sh", "/script/pvc-usage.sh"]
          volumeMounts:
            - name: script
              mountPath: /script
            - name: local-path-data
              mountPath: /data/local-path-provisioner
              readOnly: true
            - name: textfile-collector
              mountPath: /textfile
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: script
          configMap:
            name: pvc-usage-exporter-script
        - name: local-path-data
          hostPath:
            path: /data/local-path-provisioner
            type: DirectoryOrCreate
        - name: textfile-collector
          hostPath:
            path: /var/lib/node_exporter/textfile_collector
            type: DirectoryOrCreate

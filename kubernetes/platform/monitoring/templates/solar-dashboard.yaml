apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-solar-pv
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  solar-pv.json: |
    {
      "title": "Solar PV System",
      "uid": "solar-pv",
      "schemaVersion": 38,
      "version": 3,
      "refresh": "5m",
      "time": { "from": "now-7d", "to": "now" },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "name": "influxDs",
            "type": "datasource",
            "pluginId": "influxdb",
            "query": "influxdb",
            "refresh": 1,
            "hide": 2
          }
        ]
      },
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1,
          "title": "Solar Power",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "influxdb", "uid": "${influxDs}" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area",
            "orientation": "auto",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "yellow", "value": 500 },
                  { "color": "green", "value": 1500 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"solar_power\" and r._field == \"value\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)"
            }
          ]
        },
        {
          "id": 2,
          "title": "House Consumption",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "influxdb", "uid": "${influxDs}" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area",
            "orientation": "auto",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1000 },
                  { "color": "red", "value": 2000 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"house_load_power\" and r._field == \"value\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)"
            }
          ]
        },
        {
          "id": 3,
          "title": "Battery",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 4 },
          "datasource": { "type": "influxdb", "uid": "${influxDs}" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area",
            "orientation": "horizontal",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "SoC" },
                "properties": [
                  { "id": "unit", "value": "percent" },
                  { "id": "min", "value": 0 },
                  { "id": "max", "value": 100 },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "red", "value": null },
                        { "color": "yellow", "value": 20 },
                        { "color": "green", "value": 50 }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Voltage" },
                "properties": [
                  { "id": "unit", "value": "volt" },
                  { "id": "decimals", "value": 1 },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "red", "value": null },
                        { "color": "yellow", "value": 50 },
                        { "color": "green", "value": 53 }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"battery_soc\" and r._field == \"value\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> set(key: \"_field\", value: \"SoC\")"
            },
            {
              "refId": "B",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"battery_volt\" and r._field == \"value\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> set(key: \"_field\", value: \"Voltage\")"
            }
          ]
        },
        {
          "id": 4,
          "title": "Grid Import",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 4 },
          "datasource": { "type": "influxdb", "uid": "${influxDs}" },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "area",
            "orientation": "auto",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 500 },
                  { "color": "red", "value": 2000 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"grid_power\" and r._field == \"value\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)"
            }
          ]
        },
        {
          "id": 5,
          "title": "Today",
          "type": "bargauge",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "influxdb", "uid": "${influxDs}" },
          "options": {
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"], "fields": "" },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "minVizWidth": 0,
            "minVizHeight": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "decimals": 2,
              "min": 0,
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Solar Yield" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "House Consumption" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "light-blue" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Grid Import" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: today())\n  |> filter(fn: (r) => r._measurement == \"solar_power\" and r._field == \"value\")\n  |> integral(unit: 1h)\n  |> map(fn: (r) => ({r with _value: r._value / 1000.0}))\n  |> set(key: \"_field\", value: \"Solar Yield\")"
            },
            {
              "refId": "B",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: today())\n  |> filter(fn: (r) => r._measurement == \"house_load_power\" and r._field == \"value\")\n  |> integral(unit: 1h)\n  |> map(fn: (r) => ({r with _value: r._value / 1000.0}))\n  |> set(key: \"_field\", value: \"House Consumption\")"
            },
            {
              "refId": "C",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: today())\n  |> filter(fn: (r) => r._measurement == \"grid_power\" and r._field == \"value\")\n  |> integral(unit: 1h)\n  |> map(fn: (r) => ({r with _value: r._value / 1000.0}))\n  |> set(key: \"_field\", value: \"Grid Import\")"
            }
          ]
        },
        {
          "id": 6,
          "title": "This Month",
          "type": "bargauge",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "influxdb", "uid": "${influxDs}" },
          "options": {
            "reduceOptions": { "values": false, "calcs": ["lastNotNull"], "fields": "" },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "minVizWidth": 0,
            "minVizHeight": 10
          },
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "decimals": 1,
              "min": 0,
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Solar Yield" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "House Consumption" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "light-blue" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Grid Import" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket:\"long-term-data\")\n  |> range(start: -32d)\n  |> filter(fn: (r) => r._measurement == \"solar_power\" and r._field == \"value\")\n  |> last()\n  |> map(fn: (r) => ({r with _value: r._value / 1000.0}))\n  |> set(key: \"_field\", value: \"Solar Yield\")"
            },
            {
              "refId": "B",
              "query": "from(bucket:\"long-term-data\")\n  |> range(start: -32d)\n  |> filter(fn: (r) => r._measurement == \"house_load_power\" and r._field == \"value\")\n  |> last()\n  |> map(fn: (r) => ({r with _value: r._value / 1000.0}))\n  |> set(key: \"_field\", value: \"House Consumption\")"
            },
            {
              "refId": "C",
              "query": "from(bucket:\"long-term-data\")\n  |> range(start: -32d)\n  |> filter(fn: (r) => r._measurement == \"grid_power\" and r._field == \"value\")\n  |> last()\n  |> map(fn: (r) => ({r with _value: r._value / 1000.0}))\n  |> set(key: \"_field\", value: \"Grid Import\")"
            }
          ]
        },
        {
          "id": 7,
          "title": "Power Flow",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "influxdb", "uid": "${influxDs}" },
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "gradientMode": "opacity",
                "showPoints": "auto",
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Solar Production" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "House Consumption" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "light-blue" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Grid Power" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"solar_power\" and r._field == \"value\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> set(key: \"_field\", value: \"Solar Production\")"
            },
            {
              "refId": "B",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"house_load_power\" and r._field == \"value\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> set(key: \"_field\", value: \"House Consumption\")"
            },
            {
              "refId": "C",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"grid_power\" and r._field == \"value\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> set(key: \"_field\", value: \"Grid Power\")"
            }
          ]
        },
        {
          "id": 8,
          "title": "Battery State",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "influxdb", "uid": "${influxDs}" },
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "State of Charge" },
                "properties": [
                  { "id": "unit", "value": "percent" },
                  { "id": "min", "value": 0 },
                  { "id": "max", "value": 100 },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } },
                  { "id": "custom.axisPlacement", "value": "left" }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Voltage" },
                "properties": [
                  { "id": "unit", "value": "volt" },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } },
                  { "id": "custom.axisPlacement", "value": "right" },
                  { "id": "custom.axisSoftMin", "value": 44 },
                  { "id": "custom.axisSoftMax", "value": 58 }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"battery_soc\" and r._field == \"value\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> set(key: \"_field\", value: \"State of Charge\")"
            },
            {
              "refId": "B",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"battery_volt\" and r._field == \"value\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> set(key: \"_field\", value: \"Voltage\")"
            }
          ]
        },
        {
          "id": 9,
          "title": "Grid & Load Power",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "influxdb", "uid": "${influxDs}" },
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "auto",
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Grid Power" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "House Load Power" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"grid_power\" and r._field == \"value\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> set(key: \"_field\", value: \"Grid Power\")"
            },
            {
              "refId": "B",
              "query": "from(bucket:\"real-time-data\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"house_load_power\" and r._field == \"value\")\n  |> aggregateWindow(every: v.windowPeriod, fn: mean, createEmpty: false)\n  |> set(key: \"_field\", value: \"House Load Power\")"
            }
          ]
        },
        {
          "id": 10,
          "title": "Monthly Energy Overview",
          "type": "timeseries",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 24 },
          "datasource": { "type": "influxdb", "uid": "${influxDs}" },
          "options": {
            "tooltip": { "mode": "multi", "sort": "none" },
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "decimals": 0,
              "custom": {
                "drawStyle": "bars",
                "barAlignment": 0,
                "lineWidth": 1,
                "fillOpacity": 70,
                "gradientMode": "none",
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "mode": "normal", "group": "A" }
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Solar Yield" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "House Consumption" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "light-blue" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Grid Import" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket:\"long-term-data\")\n  |> range(start: -24mo)\n  |> filter(fn: (r) => r._measurement == \"solar_power\" and r._field == \"value\")\n  |> map(fn: (r) => ({r with _value: r._value / 1000.0}))\n  |> set(key: \"_field\", value: \"Solar Yield\")"
            },
            {
              "refId": "B",
              "query": "from(bucket:\"long-term-data\")\n  |> range(start: -24mo)\n  |> filter(fn: (r) => r._measurement == \"house_load_power\" and r._field == \"value\")\n  |> map(fn: (r) => ({r with _value: r._value / 1000.0}))\n  |> set(key: \"_field\", value: \"House Consumption\")"
            },
            {
              "refId": "C",
              "query": "from(bucket:\"long-term-data\")\n  |> range(start: -24mo)\n  |> filter(fn: (r) => r._measurement == \"grid_power\" and r._field == \"value\")\n  |> map(fn: (r) => ({r with _value: r._value / 1000.0}))\n  |> set(key: \"_field\", value: \"Grid Import\")"
            }
          ]
        }
      ]
    }

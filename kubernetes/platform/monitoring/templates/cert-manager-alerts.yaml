# Alerts for cert-manager certificate lifecycle.
#
# Written after the 2026-09-18 outage, where DNS-01 renewals stalled for five
# weeks and 17 certificates expired unnoticed — including jellyfin and
# authentik — because nothing watched them.
#
# The `release: monitoring` label is required: kube-prometheus-stack's
# ruleSelector matches on it, and without it these rules are ignored.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: cert-manager
      rules:
        # Renewal normally happens 30d before expiry. Firing at 14d means two
        # weeks of retries have already failed, with two weeks left to fix it.
        - alert: CertManagerCertExpiringSoon
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} expires in under 14 days"
            description: >-
              Renewal should have completed at 30 days. Check
              `kubectl get challenge -A` and the cert-manager controller logs.

        - alert: CertManagerCertExpiringCritical
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 3 * 24 * 3600
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} expires in under 3 days"
            description: >-
              Imminent TLS outage for this service. Clients will refuse the
              connection once it expires.

        # Catches a stalled renewal directly, rather than waiting for expiry.
        - alert: CertManagerCertNotReady
          expr: certmanager_certificate_ready_status{condition="True"} == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}} has not been Ready for 1h"
            description: >-
              Issuance or renewal is failing. Note cert-manager backs off up to
              32h after repeated failures; clear it with a status patch of
              lastFailureTime/failedIssuanceAttempts.

        # Meta-alert: without this, a broken ServiceMonitor or a down
        # cert-manager makes every alert above silently untestable — the exact
        # blind spot that allowed the 2026-09-18 outage.
        - alert: CertManagerMetricsMissing
          expr: absent(certmanager_certificate_expiration_timestamp_seconds)
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "cert-manager metrics are not being scraped"
            description: >-
              No certmanager_* metrics in Prometheus. The certificate expiry
              alerts cannot fire while this is true. Check the cert-manager
              ServiceMonitor and that the cert-manager pods are running.

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostfolio
  labels:
    app.kubernetes.io/name: ghostfolio
    app.kubernetes.io/instance: ghostfolio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ghostfolio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghostfolio
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-db
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - until nc -z ghostfolio-postgresql 5432; do echo "waiting for postgres..."; sleep 2; done
      containers:
        - name: ghostfolio
          image: {{ .Values.images.ghostfolio }}
          ports:
            - name: http
              containerPort: 3333
          envFrom:
            - secretRef:
                name: ghostfolio-secrets
            - secretRef:
                name: ghostfolio-oidc
                optional: true
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ghostfolio
  labels:
    app.kubernetes.io/name: ghostfolio
    app.kubernetes.io/instance: ghostfolio
spec:
  selector:
    app.kubernetes.io/name: ghostfolio
  ports:
    - name: http
      port: 3333
      targetPort: http

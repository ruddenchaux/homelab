---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-redis
  labels:
    app.kubernetes.io/name: paperless-redis
    app.kubernetes.io/instance: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.images.redis }}
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              memory: 64Mi
              cpu: 20m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-redis
  labels:
    app.kubernetes.io/name: paperless-redis
    app.kubernetes.io/instance: paperless
spec:
  selector:
    app.kubernetes.io/name: paperless-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis

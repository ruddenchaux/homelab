---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-postgresql
  labels:
    app.kubernetes.io/name: paperless-postgresql
    app.kubernetes.io/instance: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-postgresql
    spec:
      containers:
        - name: postgresql
          image: {{ .Values.images.postgres }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: paperless
            - name: POSTGRES_DB
              value: paperless
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secrets
                  key: PAPERLESS_DBPASS
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - paperless
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - paperless
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-postgresql
  labels:
    app.kubernetes.io/name: paperless-postgresql
    app.kubernetes.io/instance: paperless
spec:
  selector:
    app.kubernetes.io/name: paperless-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql

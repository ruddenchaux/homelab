---
# Patch CoreDNS to forward *.ruddenchaux.xyz queries to the Bottega router
# (10.30.0.1), which serves split-horizon DNS via the phase-4 static entry
# `ruddenchaux.xyz -> 10.30.0.200` with match-subdomain=yes.
# Without this, pods fall back to public DNS, which returns NXDOMAIN for
# internal-only hostnames and breaks OIDC discovery (Ghostfolio, Immich, ...).
#
# Previously this forwarded to AdGuardHome (10.10.20.2), which lives at Casa
# and is not reachable from Bottega. After the site move every internal lookup
# timed out, crash-looping Ghostfolio on Authentik OIDC discovery.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
    ruddenchaux.xyz:53 {
        errors
        forward . 10.30.0.1
        cache 30
    }

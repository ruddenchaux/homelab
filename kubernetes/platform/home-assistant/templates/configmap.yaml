---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ha-configuration
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/instance: home-assistant
data:
  configuration.yaml: |
    homeassistant:
      name: Home
      latitude: !secret ha_latitude
      longitude: !secret ha_longitude
      elevation: !secret ha_elevation
      currency: EUR
      country: IT
      unit_system: metric
      time_zone: Europe/Rome

    default_config:

    openid:
      client_id: !secret ha_oidc_client_id
      client_secret: !secret ha_oidc_client_secret
      configure_url: "https://auth.{{ .Values.domain }}/application/o/home-assistant/.well-known/openid-configuration"
      scope: "openid profile email"
      username_field: preferred_username
      create_user: true

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.0.0.0/16
        - 10.96.0.0/12

    mqtt:
      - climate:
          name: "BHT-6000 Thermostat"
          unique_id: bht6000_climate

          # --- Power (heat / off) ---
          modes:
            - "heat"
            - "off"
          mode_command_topic: "cmnd/bht6000/POWER1"
          mode_command_template: "{{ "{{" }}'ON' if value == 'heat' else 'OFF'{{ "}}" }}"
          mode_state_topic: "tele/bht6000/STATE"
          mode_state_template: "{{ "{{" }}'heat' if value_json.POWER1 == 'ON' else 'off'{{ "}}" }}"

          # --- Target temperature (raw x2, so divide/multiply by 2) ---
          temperature_command_topic: "cmnd/bht6000/TuyaSend2"
          temperature_command_template: "2,{{ "{{" }} (value * 2) | int {{ "}}" }}"
          temperature_state_topic: "tele/bht6000/SENSOR"
          temperature_state_template: "{{ "{{" }} value_json['TuyaSNS']['TempSet'] | float / 2 {{ "}}" }}"
          min_temp: 5
          max_temp: 35
          temp_step: 0.5
          precision: 0.5

          # --- Current temperature ---
          current_temperature_topic: "tele/bht6000/SENSOR"
          current_temperature_template: "{{ "{{" }} value_json['TuyaSNS']['Temperature'] | float / 2 {{ "}}" }}"

          # --- Manual vs Schedule mode ---
          preset_modes:
            - "manual"
            - "schedule"
          preset_mode_command_topic: "cmnd/bht6000/TuyaEnum1"
          preset_mode_command_template: "{{ "{{" }}'0' if value == 'schedule' else '1'{{ "}}" }}"
          preset_mode_state_topic: "stat/bht6000/RESULT"
          preset_mode_value_template: >
            {% if value_json.TuyaEnum1 is defined %}
              {{ "{{" }} 'schedule' if value_json.TuyaEnum1 == 0 else 'manual' {{ "}}" }}
            {% else %}
              {{ "{{" }} this.state {{ "}}" }}
            {% endif %}

          # --- Availability ---
          availability_topic: "tele/bht6000/LWT"
          payload_available: "Online"
          payload_not_available: "Offline"

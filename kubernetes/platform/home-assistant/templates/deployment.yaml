---
# Init container downloads the hass-openid custom integration from GitHub.
# This is idempotent: skips download if files already exist on the PVC.
# Source: https://github.com/cavefire/hass-openid
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/instance: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
    spec:
      initContainers:
        - name: install-hass-openid
          image: alpine:3.21
          command: [sh, -c]
          args:
            - |
              set -e
              TARGET=/config/custom_components/openid
              if [ -f "${TARGET}/__init__.py" ]; then
                echo "hass-openid already installed, skipping"
                exit 0
              fi
              mkdir -p "${TARGET}"
              wget -qO- "https://github.com/cavefire/hass-openid/archive/refs/heads/main.tar.gz" \
                | tar -xz -C /tmp/
              cp -r /tmp/hass-openid-main/custom_components/openid/. "${TARGET}/"
              echo "hass-openid installed from cavefire/hass-openid"
          volumeMounts:
            - name: ha-config
              mountPath: /config
        - name: install-hacs
          image: alpine:3.21
          command: [sh, -c]
          args:
            - |
              set -e
              TARGET=/config/custom_components/hacs
              if [ -f "${TARGET}/__init__.py" ]; then
                echo "HACS already installed, skipping"
                exit 0
              fi
              apk add --no-cache -q unzip
              mkdir -p "${TARGET}"
              wget -qO /tmp/hacs.zip \
                "https://github.com/hacs/integration/releases/latest/download/hacs.zip"
              unzip -q /tmp/hacs.zip -d "${TARGET}/"
              rm /tmp/hacs.zip
              echo "HACS installed"
          volumeMounts:
            - name: ha-config
              mountPath: /config
      containers:
        - name: home-assistant
          image: {{ .Values.image }}
          ports:
            - name: http
              containerPort: 8123
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: ha-config
              mountPath: /config
            - name: ha-configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
            - name: ha-oidc-secret
              mountPath: /config/secrets.yaml
              subPath: secrets.yaml
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
      volumes:
        - name: ha-config
          persistentVolumeClaim:
            claimName: ha-config
        - name: ha-configuration
          configMap:
            name: ha-configuration
        - name: ha-oidc-secret
          secret:
            secretName: ha-oidc-secret
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-assistant
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/instance: home-assistant
spec:
  selector:
    app.kubernetes.io/name: home-assistant
  ports:
    - name: http
      port: 8123
      targetPort: http

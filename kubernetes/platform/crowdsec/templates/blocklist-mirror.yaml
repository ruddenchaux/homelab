# Serves CrowdSec decisions as a plain IP list for the Bottega MikroTik, which
# pulls it through Traefik (see ansible/roles/bottega_crowdsec). plain_text,
# not the "mikrotik" format: that format is a RouterOS script the router would
# /import with admin rights, turning a cluster compromise into a router one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-blocklist-mirror
  namespace: crowdsec
data:
  crowdsec-blocklist-mirror.yaml: |
    config_version: v1.0
    crowdsec_config:
      lapi_key: ${API_KEY}
      lapi_url: http://crowdsec-service.crowdsec.svc.cluster.local:8080/
      update_frequency: 10s
      include_scenarios_containing: []
      exclude_scenarios_containing: []
      only_include_decisions_from: []
      insecure_skip_verify: false
      supported_decisions_types:
        - ban
    blocklists:
      - format: plain_text
        endpoint: /security/blocklist
        authentication:
          type: basic
          user: mikrotik
          password: ${MIRROR_PASSWORD}
          trusted_ips: []
    listen_uri: 0.0.0.0:41412
    tls:
      cert_file:
      key_file:
    metrics:
      enabled: true
      endpoint: /metrics
    log_media: stdout
    log_level: info
    enable_access_logs: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-blocklist-mirror
  namespace: crowdsec
  labels:
    app.kubernetes.io/name: crowdsec-blocklist-mirror
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec-blocklist-mirror
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec-blocklist-mirror
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: mirror
          image: crowdsecurity/blocklist-mirror:v0.0.6
          args:
            - -c
            - /etc/crowdsec/bouncers/crowdsec-blocklist-mirror.yaml
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-keys
                  key: bouncerKeyMirror
            - name: MIRROR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crowdsec-keys
                  key: mirrorPassword
          ports:
            - name: http
              containerPort: 41412
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/crowdsec/bouncers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: crowdsec-blocklist-mirror
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-blocklist-mirror
  namespace: crowdsec
spec:
  selector:
    app.kubernetes.io/name: crowdsec-blocklist-mirror
  ports:
    - name: http
      port: 41412
      targetPort: http
---
# Only the router's VLAN 30 address may fetch the list. This relies on
# Traefik seeing real source IPs (externalTrafficPolicy: Local).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mirror-allowlist
  namespace: crowdsec
spec:
  ipAllowList:
    sourceRange:
      - 10.30.0.1/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crowdsec-blocklist-mirror
  namespace: crowdsec
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: crowdsec-mirror-allowlist@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - crowdsec-mirror.ruddenchaux.xyz
      secretName: crowdsec-mirror-tls
  rules:
    - host: crowdsec-mirror.ruddenchaux.xyz
      http:
        paths:
          - path: /security/blocklist
            pathType: Exact
            backend:
              service:
                name: crowdsec-blocklist-mirror
                port:
                  name: http

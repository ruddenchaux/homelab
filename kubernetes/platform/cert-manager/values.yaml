cert-manager:
  crds:
    enabled: true
    keep: true

  # DNS-01 self-check must resolve via public recursive nameservers.
  # The cluster resolver forwards ruddenchaux.xyz to AdGuardHome, which is
  # split-horizon (wildcard -> Traefik LB) and cannot answer the SOA lookup
  # for _acme-challenge records, so the propagation check returns SERVFAIL.
  # Let's Encrypt queries public DNS anyway, so check against the same view.
  dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
  dns01RecursiveNameserversOnly: true

  # Expose cert-manager metrics to Prometheus. Without this ServiceMonitor the
  # certmanager_* metrics are never scraped and the expiry alerts in the
  # monitoring chart would silently never fire. The release label is what
  # kube-prometheus-stack's serviceMonitorSelector matches on.
  prometheus:
    enabled: true
    servicemonitor:
      enabled: true
      interval: 60s
      scrapeTimeout: 30s
      labels:
        release: monitoring

acmeEmail: "f.r.dainelli@gmail.com"

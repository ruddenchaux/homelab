---
# Anysub Pod: web (Go anysub HTTP server) + worker (Go --task-server + Python
# WhisperX-API) + redis (Asynq queue) sidecar.
#
# Why one Pod: src/server/server.go pins the Asynq client to 127.0.0.1:6379,
# so the web container must share a network namespace with Redis. The worker
# container shares the same Pod so it can reach the Python WhisperX-API on
# 127.0.0.1:8000 (started by worker.entrypoint.sh).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anysub
  namespace: anysub
  labels:
    {{- include "anysub.selectorLabels" "anysub" | nindent 4 }}
    {{- include "anysub.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "anysub.selectorLabels" "anysub" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "anysub.selectorLabels" "anysub" | nindent 8 }}
    spec:
      nodeSelector:
        kubernetes.io/hostname: {{ .Values.nodeName }}
      enableServiceLinks: false
      initContainers:
        - name: wait-for-mariadb
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mariadb 3306; do echo "waiting for mariadb..."; sleep 2; done
      containers:
        # Go HTTP server: serves the Templ web UI on :1337 and enqueues Asynq jobs.
        - name: web
          image: {{ .Values.images.worker }}
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/anysub"]
          ports:
            - name: http
              containerPort: 1337
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: anysub-secrets
                  key: DATABASE_URI
            - name: ROOT_DIR
              value: /app
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}

        # Worker: Go --task-server (Asynq consumer) + Python WhisperX-API on :8000.
        # Built from src/worker.cpu.Dockerfile; entrypoint.sh starts both processes.
        - name: worker
          image: {{ .Values.images.worker }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: anysub-secrets
                  key: DATABASE_URI
            - name: REDIS_HOST
              value: 127.0.0.1:6379
            - name: AS_WX_API_HOST
              value: http://127.0.0.1:8000
            - name: LIBRETRANSLATE_ENDPOINT
              value: libretranslate:5000
            - name: WHISPER_HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anysub-secrets
                  key: WHISPER_HF_TOKEN
            - name: WHISPER_MODELS
              value: {{ .Values.whisper.models | quote }}
            - name: WHISPER_THREADS
              value: {{ .Values.whisper.threads | quote }}
            - name: WHISPER_DEVICE
              value: {{ .Values.whisper.device | quote }}
            - name: WHISPER_MODELS_DIR
              value: /app/wx_models
            - name: UPLOAD_DIR
              value: /app/uploads
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: models
              mountPath: /app/wx_models
          # No probes: model preload at boot can take 5-10 min on first run; the
          # WhisperX-API only starts listening after that. Failing probes would
          # restart the container in a loop.
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}

        # Redis sidecar (Asynq queue). Reachable from web + worker via 127.0.0.1.
        - name: redis
          image: {{ .Values.images.redis }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.redis | nindent 12 }}

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: anysub-uploads
        - name: models
          persistentVolumeClaim:
            claimName: anysub-models
---
apiVersion: v1
kind: Service
metadata:
  name: anysub
  namespace: anysub
  labels:
    {{- include "anysub.selectorLabels" "anysub" | nindent 4 }}
    {{- include "anysub.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "anysub.selectorLabels" "anysub" | nindent 4 }}
  ports:
    - name: http
      port: 1337
      targetPort: http

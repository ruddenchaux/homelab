---
# Implements the router half of specs/services/crowdsec.md: the Bottega
# MikroTik pulls CrowdSec's blocklist from the in-cluster mirror (through
# Traefik, allowlisted to 10.30.0.1) every 10 minutes and drops listed
# sources on WAN TCP in raw/prerouting.
#
# Prerequisites: crowdsec-secrets.yml has run, ArgoCD has synced the crowdsec
# app, and `curl -u mikrotik:<pw> https://crowdsec-mirror.ruddenchaux.xyz/security/blocklist`
# answers 403 from any host other than the router.
#
# Run under RouterOS safe mode (or a timed rollback) from a laptop cabled to
# ether2-4, AGENTS.md #4:
#   ansible-playbook playbooks/bottega-crowdsec.yml \
#     -e bottega_crowdsec_router_recovery_confirmed=true
#
# Rollback: /ip firewall raw disable [find where comment~"bottega-crowdsec"]
#           /system scheduler disable bottega-crowdsec-sync
- name: Install Bottega CrowdSec router enforcement
  hosts: mikrotik
  gather_facts: false
  vars:
    bottega_crowdsec_router_recovery_confirmed: false

  pre_tasks:
    - name: Load Bottega-only CrowdSec secrets
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets/bottega.sops.yml"
        name: bottega_crowdsec_secrets
      no_log: true

    - name: Set the mirror password fact
      ansible.builtin.set_fact:
        bottega_crowdsec_mirror_password: >-
          {{ ansible_facts['bottega_crowdsec_secrets']['bottega_crowdsec_mirror_password'] | default('') }}
      no_log: true

  roles:
    - bottega_crowdsec

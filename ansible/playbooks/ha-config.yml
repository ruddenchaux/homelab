---
# Home Assistant configuration playbook.
#
# Execution order:
#   Step 1 (before git push):
#     ansible-playbook ansible/playbooks/ha-config.yml --tags pre-deploy
#
#   Step 2: commit + push GitOps manifests → ArgoCD deploys HA
#
#   Step 3 (after ArgoCD syncs and HA pod is ready):
#     ansible-playbook ansible/playbooks/ha-config.yml --tags post-deploy

- name: Configure Home Assistant
  hosts: k8s_control_plane
  pre_tasks:
    - name: Load secrets
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets.sops.yml"
      no_log: true
      tags: always
  roles:
    - role: ha-config

---
# Implements specs/sites/casa-phase-1-spoke.md.
#
# Turns the Casa MikroTik from the obsolete single-site lab router into the thin
# Casa spoke: builds the dial-out tunnel to the Bottega hub, gives the hub its
# side of the peer, tears down the VPS relay tunnel and the lab VLANs the lab
# took with it, and renumbers the LAN off Bottega's 192.168.88.0/24.
#
# Four plays because WireGuard has no negotiation and each end's config must be
# written with the other end's public key in hand. Neither key is a secret --
# the hub's is read live off Bottega, Casa's is generated by RouterOS on
# interface creation and only its public half is read back -- so nothing new
# goes into SOPS and Casa has no age recipient at all
# (specs/network/wireguard.md "Key custody").
#
# Play order is the Safe Application order in the spec:
#
#   A  read the hub's public key                     (Bottega, read-only)
#   B  build wg-casa with it                         (Casa, step 1)
#   C  give the hub Casa's public key + rules        (Bottega, step 2)
#   D  handshake gate, teardown, cutover             (Casa, steps 3-6)
#
# Step 7 is a second run of this same playbook, from the renumbered LAN.
#
# Prerequisites, all of which the plays check rather than assume:
#   * the dev-box can WireGuard into Bottega and reach the hub at 10.99.0.1
#   * the operator is physically at Casa (the renumber drops their session)
#   * a current `/export hide-sensitive` of the Casa router is stored off-router
#
# Cutover run (Casa still on its old address):
#
#   ansible-playbook playbooks/casa-spoke.yml \
#     -e casa_router_address=192.168.88.1 \
#     -e casa_spoke_router_export_confirmed=true \
#     -e casa_spoke_operator_onsite_confirmed=true \
#     -e bottega_casa_peer_router_recovery_confirmed=true \
#     -e casa_spoke_teardown_confirmed=true \
#     -e casa_spoke_cutover_confirmed=true
#
# Converge/validate run (step 7), after reconnecting on 192.168.90.x:
#
#   ansible-playbook playbooks/casa-spoke.yml \
#     -e casa_spoke_router_export_confirmed=true \
#     -e casa_spoke_operator_onsite_confirmed=true \
#     -e bottega_casa_peer_router_recovery_confirmed=true
#
# ---------------------------------------------------------------------------
# Split run: the two sites driven from different machines
# ---------------------------------------------------------------------------
#
# The four plays above assume one control machine that can reach both routers,
# and carry each router's public key to the other through `hostvars`. When the
# Bottega credentials live on a different machine than the one at Casa, use
# `--limit` to run each site's plays where they can actually connect, and pass
# the two public keys by hand. Neither key is a secret, so copying them between
# machines is not a secrets-handling step -- each play prints the one the other
# side needs.
#
#   1. Bottega machine  — read the hub key:
#        ansible-playbook playbooks/casa-spoke.yml --limit mikrotik \
#          -e bottega_casa_peer_router_recovery_confirmed=true
#      Play A prints the hub public key, then Play C's preflight stops on the
#      missing Casa key having changed nothing. That refusal IS step 1's
#      success. (Equivalently: ssh admin@10.99.0.1 ':put [/interface wireguard
#      get [find where name=wg-hub] public-key]')
#
#   2. Casa machine     — build wg-casa with it, and note the key it prints:
#        ansible-playbook playbooks/casa-spoke.yml --limit casa \
#          -e casa_router_address=192.168.88.1 \
#          -e casa_spoke_hub_public_key=<hub key from step 1> \
#          -e casa_spoke_router_export_confirmed=true \
#          -e casa_spoke_operator_onsite_confirmed=true
#      Stops at the teardown gate, because the tunnel cannot have handshaked
#      until step 3 -- that is the design, not a failure.
#
#   3. Bottega machine  — add the Casa peer:
#        ansible-playbook playbooks/casa-spoke.yml --limit mikrotik \
#          -e bottega_casa_peer_public_key=<Casa key from step 2> \
#          -e bottega_casa_peer_router_recovery_confirmed=true
#
#   4. Casa machine     — teardown and cutover, same command as step 2 plus
#        -e casa_spoke_teardown_confirmed=true \
#        -e casa_spoke_cutover_confirmed=true
#
#   5. Casa machine     — step 7 re-run on 192.168.90.x, dropping
#      -e casa_router_address, to converge and validate.

- name: Read the Bottega hub WireGuard identity
  hosts: mikrotik
  gather_facts: false

  pre_tasks:
    # The hub is reached over the phase 5 road-warrior tunnel. Failing here
    # means the prerequisite is unmet, and it fails before anything at either
    # site has been touched.
    - name: Confirm the Bottega hub is reachable over the tunnel
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 5
      delegate_to: localhost

  tasks:
    - name: Read the hub public key for Casa's peer
      ansible.builtin.include_role:
        name: bottega_casa_peer
        tasks_from: read-hub-key

- name: Build the Casa spoke tunnel to Bottega
  hosts: casa
  gather_facts: false
  vars:
    # Falls back to the key Play A read. In a split run Play A never executed on
    # this machine, so the fact is absent and `-e casa_spoke_hub_public_key=...`
    # supplies it instead -- extra-vars outrank play vars, so passing it simply
    # wins. Preflight rejects an empty value with an explicit message.
    casa_spoke_hub_public_key: >-
      {{ hostvars['mikrotik-gw']['bottega_casa_peer_hub_public_key']
      | default('') }}

  tasks:
    - name: Configure the Casa spoke tunnel
      ansible.builtin.include_role:
        name: casa_spoke
        tasks_from: tunnel

- name: Add the Casa peer to the Bottega hub
  hosts: mikrotik
  gather_facts: false
  vars:
    bottega_casa_peer_public_key: >-
      {{ hostvars['casa-gw']['casa_spoke_wg_public_key'] | default('') }}

  tasks:
    - name: Configure the hub-side Casa peer
      ansible.builtin.include_role:
        name: bottega_casa_peer

- name: Converge and cut over the Casa site
  hosts: casa
  gather_facts: false
  vars:
    casa_spoke_hub_public_key: >-
      {{ hostvars['mikrotik-gw']['bottega_casa_peer_hub_public_key']
      | default('') }}

  tasks:
    # Teardown and cutover. On the cutover run this play ends by arming a
    # deferred RouterOS job and the session drops shortly afterwards, on
    # purpose; on the step 7 re-run every task is a no-op.
    - name: Tear down the obsolete Casa objects and renumber the LAN
      ansible.builtin.include_role:
        name: casa_spoke
        tasks_from: site

    # Only meaningful once the renumber has landed, which is why it is the
    # step 7 run that proves the change rather than the run that applies it.
    - name: Validate the converged Casa spoke
      ansible.builtin.include_role:
        name: casa_spoke
        tasks_from: validate
      when: not (casa_spoke_cutover_needed | default(true) | bool)

---
# Pre-create Anysub credentials secret before ArgoCD deploys the chart.
# Run this BEFORE pushing the GitOps manifests.
#
# Prerequisite:
#   `anysub_hf_token` must exist in ansible/secrets.sops.yml.
#   Add it with: `sops ansible/secrets.sops.yml`
#
# Usage:
#   ansible-playbook ansible/playbooks/anysub-secrets.yml

- name: Pre-create Anysub secrets
  hosts: k8s_control_plane
  pre_tasks:
    - name: Load secrets
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets.sops.yml"
      no_log: true
  roles:
    - role: anysub-secrets

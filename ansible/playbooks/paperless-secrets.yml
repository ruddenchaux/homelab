---
# Pre-create Paperless-ngx credentials secret before ArgoCD deploys the chart.
# Run this BEFORE pushing the GitOps manifests.
#
# Also applies the Gmail OAuth client (paperless-gmail-oauth secret), read from
# the Bottega SOPS file (AGENTS.md #1). The client must be a Google "Web
# application" with redirect URI
# https://paperless.ruddenchaux.xyz/api/oauth/callback/ (trailing slash).
#   cd ansible
#   sops set secrets/bottega.sops.yml '["bottega_paperless_gmail_client_id"]' \
#     "$(jq '.web.client_id' /path/to/client_secret.json)"
#   sops set secrets/bottega.sops.yml '["bottega_paperless_gmail_client_secret"]' \
#     "$(jq '.web.client_secret' /path/to/client_secret.json)"
#
# Then connect Gmail once in the UI (Mail → Add account → Connect Gmail) and
# run ansible/playbooks/paperless-mail-rules.yml.
#
# Usage:
#   ansible-playbook ansible/playbooks/paperless-secrets.yml

- name: Pre-create Paperless-ngx secrets
  hosts: k8s_control_plane
  pre_tasks:
    - name: Load Bottega-only Paperless secrets
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets/bottega.sops.yml"
        name: paperless_bottega_secrets
      no_log: true
  roles:
    - role: paperless-secrets

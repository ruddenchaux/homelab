---
# Pre-create the Alertmanager Telegram secret. Run this BEFORE pushing the
# monitoring chart change that mounts it: a missing secret keeps the
# Alertmanager pod from starting.
#
# Create a bot with @BotFather, send it a message, then read your chat ID from
# https://api.telegram.org/bot<TOKEN>/getUpdates (.result[].message.chat.id).
# Store both in the Bottega SOPS file (AGENTS.md #1):
#   cd ansible
#   sops set secrets/bottega.sops.yml '["bottega_alertmanager_telegram_bot_token"]' '"123456:ABC..."'
#   sops set secrets/bottega.sops.yml '["bottega_alertmanager_telegram_chat_id"]' '"123456789"'
#
# Usage:
#   ansible-playbook ansible/playbooks/alertmanager-secrets.yml

- name: Pre-create Alertmanager secrets
  hosts: k8s_control_plane
  pre_tasks:
    - name: Load Bottega-only Alertmanager secrets
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets/bottega.sops.yml"
        name: alertmanager_bottega_secrets
      no_log: true
  roles:
    - role: alertmanager-secrets

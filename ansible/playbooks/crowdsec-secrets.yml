---
# Pre-create CrowdSec secrets before ArgoCD deploys the crowdsec chart and the
# Traefik bouncer middleware. Implements specs/services/crowdsec.md.
#
# Requires two values in the Bottega SOPS file (AGENTS.md #1):
#   cd ansible
#   sops set secrets/bottega.sops.yml '["bottega_crowdsec_enroll_key"]' '"KEY_FROM_app.crowdsec.net"'
#   sops set secrets/bottega.sops.yml '["bottega_crowdsec_mirror_password"]' "\"$(openssl rand -hex 24)\""
#
# Usage:
#   ansible-playbook ansible/playbooks/crowdsec-secrets.yml

- name: Pre-create CrowdSec secrets
  hosts: k8s_control_plane
  pre_tasks:
    - name: Load Bottega-only CrowdSec secrets
      community.sops.load_vars:
        file: "{{ playbook_dir }}/../secrets/bottega.sops.yml"
        name: crowdsec_bottega_secrets
      no_log: true
  roles:
    - role: crowdsec-secrets

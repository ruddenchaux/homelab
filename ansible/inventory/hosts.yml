all:
  children:
    vps:
      hosts:
        vps-relay:
          ansible_host: 89.167.62.126
    proxmox:
      hosts:
        pve:
          ansible_host: 10.10.0.2
          ansible_user: root
    # Both sites' RouterOS boxes. The shared connection settings live in
    # group_vars/routers.yml; each site's *declared state* stays in its own
    # child group, so Casa never inherits a bottega_mikrotik_* variable.
    routers:
      children:
        # Bottega (hub). Playbooks keep targeting `mikrotik`.
        # Reached at its WireGuard overlay address over the phase 5
        # road-warrior tunnel -- 192.168.88.1 is Bottega's VLAN 1 gateway but
        # it is also Casa's pre-renumber LAN gateway, so it is ambiguous from a
        # dev-box that may be sitting on either LAN.
        mikrotik:
          hosts:
            mikrotik-gw:
              ansible_host: 10.99.0.1
        # Casa (spoke). Address moves 192.168.88.1 -> 192.168.90.1 during the
        # casa-spoke.yml cutover; override casa_router_address for the run that
        # straddles it (see group_vars/casa.yml).
        casa:
          hosts:
            casa-gw:
              ansible_host: "{{ casa_router_address }}"
    k8s:
      children:
        k8s_control_plane:
          hosts:
            k8s-ctrl-01:
              ansible_host: 10.30.0.10
        k8s_workers:
          hosts:
            k8s-worker-01:
              ansible_host: 10.30.0.11
            k8s-worker-02:
              ansible_host: 10.30.0.12
            k8s-worker-03:
              ansible_host: 10.30.0.13
            k8s-worker-04:
              ansible_host: 10.30.0.14

---
# Casa (spoke) only. Connection settings are inherited from the parent
# `routers` group -- see group_vars/routers.yml. Casa deliberately inherits no
# bottega_mikrotik_* variable: the two sites declare their state independently
# (AGENTS.md #1).
#
# Casa has no SOPS file and no age recipient. Its wg-casa private key is
# generated by RouterOS and never leaves the router; only the public key is read
# back, and a public key is not a secret. See specs/network/wireguard.md
# "Key custody".

# Address Ansible dials to reach the Casa router. The default is the post-
# renumber address from specs/network/topology.md. The cutover run itself starts
# on the old address, so that one run is invoked as:
#
#   ansible-playbook playbooks/casa-spoke.yml -e casa_router_address=192.168.88.1
#
# Scoping the override to this variable rather than to ansible_host matters:
# casa-spoke.yml also targets the Bottega hub, and -e ansible_host=... would
# retarget that play too.
casa_router_address: 192.168.90.1

---
# Create Ghostfolio OAuth2 provider, application, and k8s OIDC secret

- name: Check if Ghostfolio OIDC secret exists
  become: false
  ansible.builtin.command: >-
    kubectl get secret {{ authentik_ghostfolio_secret_name }}
    -n {{ authentik_ghostfolio_secret_namespace }}
  environment:
    KUBECONFIG: /home/debian/.kube/config
  register: ghostfolio_secret_check
  changed_when: false
  failed_when: false

- name: Generate Ghostfolio client credentials
  when: ghostfolio_secret_check.rc != 0
  block:
    - name: Generate Ghostfolio client ID
      become: false
      ansible.builtin.command: openssl rand -hex 20
      register: ghostfolio_client_id_result
      changed_when: false
      no_log: true

    - name: Generate Ghostfolio client secret
      become: false
      ansible.builtin.command: openssl rand -hex 40
      register: ghostfolio_client_secret_result
      changed_when: false
      no_log: true

    - name: Set Ghostfolio client credentials
      ansible.builtin.set_fact:
        ghostfolio_client_id: "{{ ghostfolio_client_id_result.stdout }}"
        ghostfolio_client_secret: "{{ ghostfolio_client_secret_result.stdout }}"
      no_log: true

- name: Load existing Ghostfolio client credentials from secret
  when: ghostfolio_secret_check.rc == 0
  block:
    - name: Read Ghostfolio client ID from secret
      become: false
      ansible.builtin.command: >-
        kubectl get secret {{ authentik_ghostfolio_secret_name }}
        -n {{ authentik_ghostfolio_secret_namespace }}
        -o jsonpath='{.data.OIDC_CLIENT_ID}'
      environment:
        KUBECONFIG: /home/debian/.kube/config
      register: ghostfolio_existing_id
      changed_when: false
      no_log: true

    - name: Read Ghostfolio client secret from secret
      become: false
      ansible.builtin.command: >-
        kubectl get secret {{ authentik_ghostfolio_secret_name }}
        -n {{ authentik_ghostfolio_secret_namespace }}
        -o jsonpath='{.data.OIDC_CLIENT_SECRET}'
      environment:
        KUBECONFIG: /home/debian/.kube/config
      register: ghostfolio_existing_secret
      changed_when: false
      no_log: true

    - name: Set Ghostfolio client credentials from existing secret
      ansible.builtin.set_fact:
        ghostfolio_client_id: "{{ ghostfolio_existing_id.stdout | b64decode }}"
        ghostfolio_client_secret: "{{ ghostfolio_existing_secret.stdout | b64decode }}"
      no_log: true

- name: Check if Ghostfolio OAuth2 provider exists
  become: false
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_local_port }}/api/v3/providers/oauth2/?name={{ authentik_ghostfolio_provider_name | urlencode }}"
    headers:
      Authorization: "Bearer {{ authentik_api_token }}"
    return_content: true
  register: ghostfolio_provider_check
  no_log: true

- name: Create Ghostfolio OAuth2 provider
  become: false
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_local_port }}/api/v3/providers/oauth2/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_api_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ authentik_ghostfolio_provider_name }}"
      client_type: confidential
      client_id: "{{ ghostfolio_client_id }}"
      client_secret: "{{ ghostfolio_client_secret }}"
      redirect_uris:
        - matching_mode: strict
          url: "https://portfolio.{{ authentik_domain }}/api/v1/auth/oidc/callback"
      authorization_flow: "{{ authentik_authorization_flow }}"
      authentication_flow: "{{ authentik_authentication_flow }}"
      invalidation_flow: "{{ authentik_invalidation_flow }}"
      signing_key: "{{ authentik_signing_key }}"
      property_mappings:
        - "{{ authentik_scope_openid }}"
        - "{{ authentik_scope_email }}"
        - "{{ authentik_scope_profile }}"
    status_code: 201
  register: ghostfolio_provider_created
  no_log: true
  when: ghostfolio_provider_check.json.pagination.count == 0

- name: Set Ghostfolio provider PK
  ansible.builtin.set_fact:
    ghostfolio_provider_pk: >-
      {{ (ghostfolio_provider_check.json.pagination.count > 0)
         | ternary(ghostfolio_provider_check.json.results[0].pk,
                   ghostfolio_provider_created.json.pk) }}

- name: Check if Ghostfolio application exists
  become: false
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_local_port }}/api/v3/core/applications/?slug={{ authentik_ghostfolio_app_slug }}"
    headers:
      Authorization: "Bearer {{ authentik_api_token }}"
    return_content: true
  register: ghostfolio_app_check
  no_log: true

- name: Create Ghostfolio application
  become: false
  ansible.builtin.uri:
    url: "http://localhost:{{ authentik_local_port }}/api/v3/core/applications/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_api_token }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ authentik_ghostfolio_provider_name }}"
      slug: "{{ authentik_ghostfolio_app_slug }}"
      provider: "{{ ghostfolio_provider_pk }}"
      meta_launch_url: "https://portfolio.{{ authentik_domain }}"
    status_code: 201
  no_log: true
  when: ghostfolio_app_check.json.pagination.count == 0

- name: Create Ghostfolio OIDC k8s secret
  become: false
  ansible.builtin.command:
    argv:
      - kubectl
      - create
      - secret
      - generic
      - "{{ authentik_ghostfolio_secret_name }}"
      - "-n"
      - "{{ authentik_ghostfolio_secret_namespace }}"
      - "--from-literal=ENABLE_FEATURE_AUTH_OIDC=true"
      - "--from-literal=OIDC_CLIENT_ID={{ ghostfolio_client_id }}"
      - "--from-literal=OIDC_CLIENT_SECRET={{ ghostfolio_client_secret }}"
      - "--from-literal=OIDC_ISSUER={{ authentik_external_url }}/application/o/{{ authentik_ghostfolio_app_slug }}/"
      - "--from-literal=OIDC_DISCOVERY_URL={{ authentik_external_url }}/application/o/{{ authentik_ghostfolio_app_slug }}/.well-known/openid-configuration"
      - "--from-literal=OIDC_CALLBACK_URL=https://portfolio.{{ authentik_domain }}/api/v1/auth/oidc/callback"
  environment:
    KUBECONFIG: /home/debian/.kube/config
  no_log: true
  when: ghostfolio_secret_check.rc != 0

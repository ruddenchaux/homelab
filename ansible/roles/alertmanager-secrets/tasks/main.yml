---
# Telegram bot token for Alertmanager. Mounted by the Alertmanager pod
# (alertmanagerSpec.secrets), so it must exist before the monitoring chart
# syncs. Re-applied every run so a rotated token in SOPS reaches the cluster.

- name: Create monitoring namespace
  become: false
  ansible.builtin.command: kubectl create namespace {{ alertmanager_namespace }}
  environment:
    KUBECONFIG: /home/debian/.kube/config
  register: alertmanager_ns
  changed_when: "'created' in alertmanager_ns.stdout"
  failed_when: alertmanager_ns.rc != 0 and 'already exists' not in alertmanager_ns.stderr

- name: Require provisioned Telegram bot token
  ansible.builtin.assert:
    that:
      - _alertmanager_sops.bottega_alertmanager_telegram_bot_token is defined
      - _alertmanager_sops.bottega_alertmanager_telegram_bot_token | length > 0
    quiet: true
    fail_msg: >-
      Add bottega_alertmanager_telegram_bot_token to
      ansible/secrets/bottega.sops.yml;
      see the header of ansible/playbooks/alertmanager-secrets.yml.
  vars:
    _alertmanager_sops: "{{ ansible_facts['alertmanager_bottega_secrets'] | default({}) }}"
  no_log: true

- name: Apply alertmanager-telegram secret
  become: false
  ansible.builtin.shell: >-
    set -o pipefail &&
    kubectl create secret generic {{ alertmanager_telegram_secret_name }}
    -n {{ alertmanager_namespace }}
    --from-literal=bot_token={{ _sops.bottega_alertmanager_telegram_bot_token | quote }}
    --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  vars:
    _sops: "{{ ansible_facts['alertmanager_bottega_secrets'] }}"
  environment:
    KUBECONFIG: /home/debian/.kube/config
  register: alertmanager_telegram_secret
  changed_when: "'unchanged' not in alertmanager_telegram_secret.stdout"
  no_log: true

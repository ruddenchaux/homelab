---
# Initialize the Kubernetes control plane
- name: Check if kubeadm has already been initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_init_check

- name: Initialize Kubernetes control plane
  ansible.builtin.command: >-
    kubeadm init
    --pod-network-cidr={{ k8s_pod_cidr }}
    --service-cidr={{ k8s_service_cidr }}
    --apiserver-advertise-address={{ k8s_api_advertise_address }}
    --control-plane-endpoint={{ k8s_api_advertise_address }}
  when: not kubeadm_init_check.stat.exists

# Set up kubeconfig for debian user
- name: Create .kube directory for debian user
  ansible.builtin.file:
    path: /home/debian/.kube
    state: directory
    owner: debian
    group: debian
    mode: "0755"

- name: Copy admin.conf to debian user kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/debian/.kube/config
    remote_src: true
    owner: debian
    group: debian
    mode: "0600"

# Install Helm
- name: Check if Helm is installed
  ansible.builtin.command: helm version --short
  register: helm_check
  changed_when: false
  failed_when: false

- name: Download Helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get-helm-3.sh
    mode: "0755"
  when: helm_check.rc != 0

- name: Install Helm
  ansible.builtin.command: /tmp/get-helm-3.sh
  environment:
    DESIRED_VERSION: ""
  when: helm_check.rc != 0

# Install Cilium CNI
- name: Add Cilium Helm repository
  become: false
  ansible.builtin.command: helm repo add cilium https://helm.cilium.io/
  register: cilium_repo
  changed_when: "'has been added' in cilium_repo.stdout"
  failed_when: cilium_repo.rc != 0 and 'already exists' not in cilium_repo.stderr

- name: Update Helm repositories
  become: false
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Install Cilium
  become: false
  ansible.builtin.command: >-
    helm upgrade --install cilium cilium/cilium
    --version {{ cilium_version }}
    --namespace kube-system
    --set operator.replicas=1
  environment:
    KUBECONFIG: /home/debian/.kube/config
  register: cilium_install
  changed_when: "'STATUS: deployed' in cilium_install.stdout"

- name: Wait for Cilium pods to be ready
  become: false
  ansible.builtin.command: >-
    kubectl wait --for=condition=Ready
    pods -l app.kubernetes.io/part-of=cilium
    -n kube-system
    --timeout=300s
  environment:
    KUBECONFIG: /home/debian/.kube/config
  changed_when: false
  retries: 3
  delay: 10
  register: cilium_wait
  until: cilium_wait.rc == 0

# Generate join command for workers
- name: Generate kubeadm join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_output
  changed_when: false

- name: Store join command as fact
  ansible.builtin.set_fact:
    k8s_join_command: "{{ join_command_output.stdout }}"

# Expose control-plane metrics to Prometheus.
#
# kubeadm binds these endpoints to 127.0.0.1, so a Prometheus pod can never
# reach them. kube-prometheus-stack reads "cannot scrape" as "component down"
# and fires etcdMembersDown, etcdInsufficientMembers and four TargetDown
# alerts permanently — noise that trained us to ignore a critical alert while
# 17 certificates quietly expired.
#
# Editing a static pod manifest makes kubelet restart that component. etcd
# restarting briefly interrupts the API server on a single-control-plane
# cluster, so these run one at a time.
- name: Bind etcd metrics to all interfaces
  become: true
  ansible.builtin.replace:
    path: /etc/kubernetes/manifests/etcd.yaml
    regexp: '--listen-metrics-urls=http://127\.0\.0\.1:2381'
    replace: '--listen-metrics-urls=http://0.0.0.0:2381'
  tags: [control-plane-metrics]

- name: Bind scheduler and controller-manager metrics to all interfaces
  become: true
  ansible.builtin.replace:
    path: "/etc/kubernetes/manifests/{{ item }}"
    regexp: '--bind-address=127\.0\.0\.1'
    replace: '--bind-address=0.0.0.0'
  loop:
    - kube-controller-manager.yaml
    - kube-scheduler.yaml
  tags: [control-plane-metrics]

- name: Read current kube-proxy config
  become: false
  ansible.builtin.command: kubectl -n kube-system get cm kube-proxy -o jsonpath={.data.config\.conf}
  environment:
    KUBECONFIG: /home/debian/.kube/config
  register: kube_proxy_config
  changed_when: false
  tags: [control-plane-metrics]

- name: Bind kube-proxy metrics to all interfaces
  become: false
  when: '''metricsBindAddress: "0.0.0.0:10249"'' not in kube_proxy_config.stdout'
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      kubectl -n kube-system get cm kube-proxy -o yaml
      | sed 's|metricsBindAddress: .*|metricsBindAddress: "0.0.0.0:10249"|'
      | kubectl apply -f -
    executable: /bin/bash
  environment:
    KUBECONFIG: /home/debian/.kube/config
  register: kube_proxy_patch
  changed_when: "'configured' in kube_proxy_patch.stdout"
  notify: Restart kube-proxy
  tags: [control-plane-metrics]

---
# Metrics bindings persisted into the kubeadm ClusterConfiguration so that
# `kubeadm upgrade` regenerates the static pod manifests with them intact.
# kubeadm v1beta4 expects extraArgs as a list of name/value pairs.
k8s_control_plane_metrics_args:
  controllerManager:
    extraArgs:
      - name: bind-address
        value: 0.0.0.0
  scheduler:
    extraArgs:
      - name: bind-address
        value: 0.0.0.0
  etcd:
    local:
      extraArgs:
        - name: listen-metrics-urls
          value: http://0.0.0.0:2381

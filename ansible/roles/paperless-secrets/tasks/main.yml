---
# Create paperless namespace and pre-generate credentials secret.
# Idempotent: only generates secret if it doesn't already exist.

- name: Create paperless namespace
  become: false
  ansible.builtin.command: kubectl create namespace {{ paperless_namespace }}
  environment:
    KUBECONFIG: /home/debian/.kube/config
  register: paperless_ns
  changed_when: "'created' in paperless_ns.stdout"
  failed_when: paperless_ns.rc != 0 and 'already exists' not in paperless_ns.stderr

- name: Check if paperless-secrets exists
  become: false
  ansible.builtin.command: >-
    kubectl get secret {{ paperless_secret_name }}
    -n {{ paperless_namespace }}
  environment:
    KUBECONFIG: /home/debian/.kube/config
  register: paperless_secret_check
  changed_when: false
  failed_when: false

- name: Generate and create paperless-secrets
  when: paperless_secret_check.rc != 0
  block:
    - name: Generate PostgreSQL password
      become: false
      ansible.builtin.command: openssl rand -base64 30
      register: paperless_db_password
      changed_when: false
      no_log: true

    - name: Generate Django secret key
      become: false
      ansible.builtin.command: openssl rand -hex 32
      register: paperless_secret_key
      changed_when: false
      no_log: true

    - name: Generate admin password
      become: false
      ansible.builtin.command: openssl rand -base64 20
      register: paperless_admin_password
      changed_when: false
      no_log: true

    - name: Create paperless-secrets
      become: false
      ansible.builtin.command: >-
        kubectl create secret generic {{ paperless_secret_name }}
        -n {{ paperless_namespace }}
        --from-literal=PAPERLESS_DBPASS={{ paperless_db_password.stdout }}
        --from-literal=PAPERLESS_SECRET_KEY={{ paperless_secret_key.stdout }}
        --from-literal=PAPERLESS_ADMIN_PASSWORD={{ paperless_admin_password.stdout }}
      environment:
        KUBECONFIG: /home/debian/.kube/config
      no_log: true

    - name: Display admin password (save this!)
      ansible.builtin.debug:
        msg: "Paperless admin password: {{ paperless_admin_password.stdout }}"

- name: paperless-secrets already exists
  ansible.builtin.debug:
    msg: "Secret {{ paperless_secret_name }} already exists — skipping generation"
  when: paperless_secret_check.rc == 0

# Gmail OAuth client for mail accounts. Re-applied every run so a rotated
# client in SOPS reaches the cluster.
- name: Require provisioned Paperless Gmail OAuth client
  ansible.builtin.assert:
    that:
      - _paperless_sops.bottega_paperless_gmail_client_id is defined
      - _paperless_sops.bottega_paperless_gmail_client_id | length > 0
      - _paperless_sops.bottega_paperless_gmail_client_secret is defined
      - _paperless_sops.bottega_paperless_gmail_client_secret | length > 0
    quiet: true
    fail_msg: >-
      Add bottega_paperless_gmail_client_id and
      bottega_paperless_gmail_client_secret to ansible/secrets/bottega.sops.yml;
      see the header of ansible/playbooks/paperless-secrets.yml.
  vars:
    _paperless_sops: "{{ ansible_facts['paperless_bottega_secrets'] | default({}) }}"
  no_log: true

- name: Apply paperless-gmail-oauth secret
  become: false
  ansible.builtin.shell: >-
    set -o pipefail &&
    kubectl create secret generic {{ paperless_gmail_secret_name }}
    -n {{ paperless_namespace }}
    --from-literal=PAPERLESS_GMAIL_OAUTH_CLIENT_ID={{ _sops.bottega_paperless_gmail_client_id | quote }}
    --from-literal=PAPERLESS_GMAIL_OAUTH_CLIENT_SECRET={{ _sops.bottega_paperless_gmail_client_secret | quote }}
    --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  vars:
    _sops: "{{ ansible_facts['paperless_bottega_secrets'] }}"
  environment:
    KUBECONFIG: /home/debian/.kube/config
  register: paperless_gmail_secret
  changed_when: "'unchanged' not in paperless_gmail_secret.stdout"
  no_log: true

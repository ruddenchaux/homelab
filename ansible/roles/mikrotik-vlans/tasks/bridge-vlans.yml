---
- name: Read trunk bridge-port state
  community.routeros.command:
    commands:
      - >-
        /interface bridge port print terse
        where bridge={{ mikrotik_bridge }}
        interface={{ mikrotik_trunk_port }}
  register: _mikrotik_trunk_bridge_port
  changed_when: false

- name: Make the trunk tagged-only with ingress filtering
  community.routeros.command:
    commands:
      - >-
        /interface bridge port set
        [find where bridge={{ mikrotik_bridge }}
        interface={{ mikrotik_trunk_port }}]
        frame-types=admit-only-vlan-tagged
        ingress-filtering=yes
  when: >-
    'frame-types=admit-only-vlan-tagged'
    not in (_mikrotik_trunk_bridge_port.stdout[0] |
    regex_replace('[\r\n]', ''))
    or
    'ingress-filtering=yes'
    not in (_mikrotik_trunk_bridge_port.stdout[0] |
    regex_replace('[\r\n]', ''))

- name: Configure the untagged management VLAN
  ansible.builtin.include_tasks: bridge-vlan-entry.yml
  vars:
    _mikrotik_bridge_vlan_id: 1
    _mikrotik_bridge_vlan_tagged: []
    _mikrotik_bridge_vlan_untagged: >-
      {{ [_mikrotik_bridge_vlan_cpu_port] +
      _mikrotik_untagged_management_ports }}
    _mikrotik_bridge_vlan_comment: Ansible_VLAN1_management

- name: Configure tagged VLANs on the server trunk
  ansible.builtin.include_tasks: bridge-vlan-entry.yml
  loop: "{{ vlans }}"
  loop_control:
    loop_var: _mikrotik_vlan
    label: "VLAN {{ _mikrotik_vlan.id }}"
  vars:
    _mikrotik_bridge_vlan_id: "{{ _mikrotik_vlan.id }}"
    _mikrotik_bridge_vlan_tagged:
      - "{{ _mikrotik_bridge_vlan_cpu_port }}"
      - "{{ mikrotik_trunk_port }}"
    _mikrotik_bridge_vlan_untagged: []
    _mikrotik_bridge_vlan_comment: >-
      {{ _mikrotik_vlan.comment | regex_replace(' ', '_') }}

- name: Validate the complete bridge VLAN table before enabling filtering
  ansible.builtin.include_tasks: validate-bridge-table.yml

- name: Read bridge VLAN-filtering state
  community.routeros.command:
    commands:
      - /interface bridge print terse where name={{ mikrotik_bridge }}
  register: _mikrotik_bridge_filtering
  changed_when: false

- name: Enable bridge VLAN filtering after table validation
  community.routeros.command:
    commands:
      - >-
        /interface bridge set
        [find where name={{ mikrotik_bridge }}]
        vlan-filtering=yes
  when: >-
    'vlan-filtering=yes'
    not in (_mikrotik_bridge_filtering.stdout[0] |
    regex_replace('[\r\n]', ''))

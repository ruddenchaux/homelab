---
- name: Validate fixed Bottega CrowdSec deployment inputs
  ansible.builtin.assert:
    that:
      - bottega_crowdsec_wan_list == 'WAN'
      - bottega_crowdsec_mirror_url.startswith('https://' ~ bottega_crowdsec_mirror_hostname ~ '/')
      - bottega_crowdsec_traefik_address == '10.30.0.200'
      - bottega_crowdsec_list_a != bottega_crowdsec_list_b
      - (bottega_crowdsec_read_chunk | int) <= 32768
      - bottega_crowdsec_ca_roots | length >= 1
    quiet: true
    fail_msg: >-
      The CrowdSec router role is fixed to the WAN list, the mirror behind
      Traefik at 10.30.0.200, two distinct address lists, and a /file read
      chunk of at most 32768 bytes.

- name: Require Bottega CrowdSec operator safety confirmation
  ansible.builtin.assert:
    that:
      - bottega_crowdsec_router_recovery_confirmed | bool
    quiet: true
    fail_msg: >-
      Take an /export hide-sensitive off-router, enter RouterOS safe mode or
      arm a timed rollback, make sure LAN/MAC-WinBox recovery works, then pass
      -e bottega_crowdsec_router_recovery_confirmed=true. No router changes
      were made.

- name: Require the mirror password from the Bottega SOPS file
  ansible.builtin.assert:
    that:
      - bottega_crowdsec_mirror_password is defined
      - bottega_crowdsec_mirror_password | length >= 32
      - bottega_crowdsec_mirror_password is match('^[A-Za-z0-9]+$')
    quiet: true
    fail_msg: >-
      bottega_crowdsec_mirror_password must be set in
      ansible/secrets/bottega.sops.yml (alphanumeric, >= 32 chars, the same
      value crowdsec-secrets.yml put in the crowdsec-keys secret).
  no_log: true

- name: Read Bottega CrowdSec prerequisite state
  community.routeros.command:
    commands:
      - :put [/system resource get version]
      - >-
        /interface list member print count-only
        where list="{{ bottega_crowdsec_wan_list }}" interface="pppoe-out1"
      - ':put [:resolve "{{ bottega_crowdsec_mirror_hostname }}"]'
      - /ip firewall filter print count-only where chain="input"
  register: bottega_crowdsec_prereq
  changed_when: false

- name: Record the untouched input-chain length
  ansible.builtin.set_fact:
    bottega_crowdsec_input_rule_count: >-
      {{ bottega_crowdsec_prereq.stdout_lines[3] | last | trim | int }}
    bottega_crowdsec_routeros_version: >-
      {{ bottega_crowdsec_prereq.stdout_lines[0] | last | trim | split(' ') | first }}

- name: Require RouterOS 7.13+, the PPPoE WAN, and split DNS for the mirror
  ansible.builtin.assert:
    that:
      # /file read (chunked) is required by the sync script.
      - bottega_crowdsec_routeros_version is version('7.13', '>=')
      - (bottega_crowdsec_prereq.stdout_lines[1] | last | trim | int) == 1
      - (bottega_crowdsec_prereq.stdout_lines[2] | last | trim) == bottega_crowdsec_traefik_address
    quiet: true
    fail_msg: >-
      Needs RouterOS >= 7.13 (found {{ bottega_crowdsec_routeros_version }}),
      pppoe-out1 in the WAN list (phase 2), and the phase 4 split-DNS record
      resolving {{ bottega_crowdsec_mirror_hostname }} to
      {{ bottega_crowdsec_traefik_address }}.

- name: Count owned Bottega CrowdSec objects
  community.routeros.command:
    commands:
      - /disk print count-only where slot="{{ bottega_crowdsec_tmpfs_slot }}"
      - /system script print count-only where name="{{ bottega_crowdsec_script_name }}"
      - /system scheduler print count-only where name="{{ bottega_crowdsec_scheduler_name }}"
      - /ip firewall raw print count-only where comment="{{ bottega_crowdsec_raw_comment_a }}"
      - /ip firewall raw print count-only where comment="{{ bottega_crowdsec_raw_comment_b }}"
  register: bottega_crowdsec_owned_counts
  changed_when: false

- name: Record owned object counts
  ansible.builtin.set_fact:
    bottega_crowdsec_counts:
      tmpfs: "{{ bottega_crowdsec_owned_counts.stdout_lines[0] | last | trim | int }}"
      script: "{{ bottega_crowdsec_owned_counts.stdout_lines[1] | last | trim | int }}"
      scheduler: "{{ bottega_crowdsec_owned_counts.stdout_lines[2] | last | trim | int }}"
      raw_a: "{{ bottega_crowdsec_owned_counts.stdout_lines[3] | last | trim | int }}"
      raw_b: "{{ bottega_crowdsec_owned_counts.stdout_lines[4] | last | trim | int }}"

- name: Refuse ambiguous owned state
  ansible.builtin.assert:
    that:
      - bottega_crowdsec_counts.values() | map('int') | max <= 1
    quiet: true
    fail_msg: >-
      An owned CrowdSec object exists more than once ({{ bottega_crowdsec_counts }}).
      Resolve it manually under safe mode; automation will not guess which
      one is intended.

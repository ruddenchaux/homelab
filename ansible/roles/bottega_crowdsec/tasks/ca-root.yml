---
# Identity is the SHA-256 fingerprint, not the name: the PEM is fetched without
# TLS verification (there is no trust store yet), so only a certificate whose
# fingerprint matches the pinned value is ever kept.
- name: Count the pinned root {{ bottega_crowdsec_ca.name }}
  community.routeros.command:
    commands:
      - /certificate print count-only where fingerprint="{{ bottega_crowdsec_ca.sha256 }}"
  register: _bottega_crowdsec_ca_count
  changed_when: false

- name: Import the pinned root {{ bottega_crowdsec_ca.name }}
  when: (_bottega_crowdsec_ca_count.stdout_lines[0] | last | trim | int) == 0
  block:
    - name: Download and import {{ bottega_crowdsec_ca.name }}
      community.routeros.command:
        commands:
          - >-
            /tool fetch url="{{ bottega_crowdsec_ca.url }}" check-certificate=no
            dst-path="{{ bottega_crowdsec_tmpfs_slot }}/{{ bottega_crowdsec_ca.name }}.pem"
          - >-
            /certificate import
            file-name="{{ bottega_crowdsec_tmpfs_slot }}/{{ bottega_crowdsec_ca.name }}.pem"
            passphrase=""
          - >-
            /file remove [find where
            name="{{ bottega_crowdsec_tmpfs_slot }}/{{ bottega_crowdsec_ca.name }}.pem"]

    - name: Recount {{ bottega_crowdsec_ca.name }} by fingerprint
      community.routeros.command:
        commands:
          - /certificate print count-only where fingerprint="{{ bottega_crowdsec_ca.sha256 }}"
      register: _bottega_crowdsec_ca_recount
      changed_when: false

    - name: Remove a mismatched import and stop
      when: (_bottega_crowdsec_ca_recount.stdout_lines[0] | last | trim | int) != 1
      block:
        - name: Remove certificates imported from the unverified download
          community.routeros.command:
            commands:
              - >-
                /certificate remove [find where
                name~"^{{ bottega_crowdsec_ca.name }}" and
                fingerprint!="{{ bottega_crowdsec_ca.sha256 }}"]

        - name: Fail on fingerprint mismatch
          ansible.builtin.fail:
            msg: >-
              {{ bottega_crowdsec_ca.url }} did not import as a certificate with
              SHA-256 {{ bottega_crowdsec_ca.sha256 }}. It was removed. Check
              the download and `/certificate print detail` by hand.

- name: Name and trust the pinned root {{ bottega_crowdsec_ca.name }}
  community.routeros.command:
    commands:
      - >-
        /certificate set [find where fingerprint="{{ bottega_crowdsec_ca.sha256 }}"]
        name={{ bottega_crowdsec_ca.name }} trusted=yes
  changed_when: false

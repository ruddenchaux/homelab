---
# Implements the router half of specs/services/crowdsec.md.
bottega_crowdsec_wan_list: WAN
bottega_crowdsec_mirror_url: https://crowdsec-mirror.ruddenchaux.xyz/security/blocklist
bottega_crowdsec_mirror_hostname: crowdsec-mirror.ruddenchaux.xyz
bottega_crowdsec_mirror_user: mikrotik
bottega_crowdsec_traefik_address: 10.30.0.200
# Two lists, filled alternately so a sync never leaves the router without
# entries: fill the empty one, then clear the other.
bottega_crowdsec_list_a: crowdsec-a
bottega_crowdsec_list_b: crowdsec-b
bottega_crowdsec_sync_interval: 10m
# Safety net: if the scheduler or the mirror stops, entries age out rather
# than blocking stale addresses forever. Must exceed the interval.
bottega_crowdsec_entry_timeout: 1h
bottega_crowdsec_tmpfs_slot: crowdsec-tmp
bottega_crowdsec_tmpfs_size: 8M
bottega_crowdsec_read_chunk: 32768
# Let's Encrypt roots for the mirror certificate. Leaves currently chain
# YR2 -> Root YR -> (cross-signed by) ISRG Root X1; trusting both keeps the
# fetch working when the X1 cross-sign is dropped. Fingerprints are SHA-256,
# verified against letsencrypt.org/certificates on 2026-09-19.
bottega_crowdsec_ca_roots:
  - name: bottega-crowdsec-isrg-root-x1
    url: https://letsencrypt.org/certs/isrgrootx1.pem
    sha256: 96bcec06264976f37460779acf28c5a7cfe8a3c0aae11a8ffcee05c0bddf08c6
  - name: bottega-crowdsec-isrg-root-yr
    url: https://letsencrypt.org/certs/gen-y/root-yr.pem
    sha256: e57b7e6f150c419102e8d5c055729ff967b9d1a829bf00cec89ca604ebf4a86f

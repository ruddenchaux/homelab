---
- name: Set Bottega admin recovery password
  community.routeros.command:
    commands:
      - >-
        /user set [find where name={{ bottega_mikrotik_admin_user }}]
        password="{{ _bottega_mikrotik_admin_password }}"
  changed_when: false
  no_log: true

- name: Read Bottega admin SSH keys
  community.routeros.command:
    commands:
      - /user ssh-keys print detail where user={{ bottega_mikrotik_admin_user }}
  register: _bottega_admin_ssh_keys
  changed_when: false

- name: Remove stale managed Bottega admin SSH keys
  community.routeros.command:
    commands:
      - >-
        /user ssh-keys remove
        [find where user={{ bottega_mikrotik_admin_user }}
        key-owner~"^{{ bottega_mikrotik_admin_ssh_key_owner_prefix }}-"]
  when:
    - _bottega_admin_ssh_key_owner not in _bottega_admin_ssh_keys.stdout[0]
    - >-
      bottega_mikrotik_admin_ssh_key_owner_prefix in
      _bottega_admin_ssh_keys.stdout[0]

- name: Use recovery password while importing first Bottega admin SSH key
  ansible.builtin.set_fact:
    ansible_password: "{{ _bottega_mikrotik_admin_password }}"
    ansible_private_key_file: null
    ansible_ssh_private_key_file: null
  when: _bottega_admin_ssh_key_owner not in _bottega_admin_ssh_keys.stdout[0]
  no_log: true

- name: Reset RouterOS connection for Bottega SSH key import
  ansible.builtin.meta: reset_connection

- name: Create temporary Bottega admin public key file
  ansible.builtin.tempfile:
    state: file
    suffix: .pub
  delegate_to: localhost
  register: _bottega_admin_ssh_public_key_temp
  when: _bottega_admin_ssh_key_owner not in _bottega_admin_ssh_keys.stdout[0]

- name: Write temporary Bottega admin public key file
  ansible.builtin.copy:
    content: "{{ _bottega_admin_ssh_public_key_import_line }}\n"
    dest: "{{ _bottega_admin_ssh_public_key_temp.path }}"
    mode: "0600"
  delegate_to: localhost
  when: _bottega_admin_ssh_key_owner not in _bottega_admin_ssh_keys.stdout[0]

- name: Upload Bottega admin public key to RouterOS
  ansible.netcommon.net_put:
    src: "{{ _bottega_admin_ssh_public_key_temp.path }}"
    dest: "{{ _bottega_admin_ssh_public_key_remote_file }}"
  when: _bottega_admin_ssh_key_owner not in _bottega_admin_ssh_keys.stdout[0]

- name: Reset RouterOS connection after Bottega public key upload
  ansible.builtin.meta: reset_connection

- name: Import Bottega admin public key into RouterOS
  community.routeros.command:
    commands:
      - >-
        /user ssh-keys import
        public-key-file={{ _bottega_admin_ssh_public_key_remote_file }}
        user={{ bottega_mikrotik_admin_user }}
  when: _bottega_admin_ssh_key_owner not in _bottega_admin_ssh_keys.stdout[0]

- name: Remove uploaded Bottega admin public key from RouterOS files
  community.routeros.command:
    commands:
      - >-
        /file remove
        [find where name="{{ _bottega_admin_ssh_public_key_remote_file }}"]
  when: _bottega_admin_ssh_key_owner not in _bottega_admin_ssh_keys.stdout[0]

- name: Remove local temporary Bottega admin public key file
  ansible.builtin.file:
    path: "{{ _bottega_admin_ssh_public_key_temp.path }}"
    state: absent
  delegate_to: localhost
  when: _bottega_admin_ssh_public_key_temp.path is defined

- name: Use Bottega admin SSH key for remaining tasks
  ansible.builtin.set_fact:
    ansible_password: null
    ansible_private_key_file: >-
      {{ _bottega_mikrotik_runtime_private_key_file }}
    ansible_ssh_private_key_file: >-
      {{ _bottega_mikrotik_runtime_private_key_file }}
  no_log: true

- name: Reset RouterOS connection for Bottega admin SSH key
  ansible.builtin.meta: reset_connection

- name: Verify Bottega admin SSH key login before disabling passwords
  community.routeros.command:
    commands:
      - /user ssh-keys print detail where user={{ bottega_mikrotik_admin_user }}
  register: _bottega_admin_ssh_keys_after_import
  changed_when: false

- name: Assert Bottega admin SSH key is usable before disabling passwords
  ansible.builtin.assert:
    that:
      - >-
        _bottega_admin_ssh_key_owner in
        _bottega_admin_ssh_keys_after_import.stdout[0]
    quiet: true
    fail_msg: >-
      Bottega admin SSH key was not visible after reconnecting; refusing to
      disable SSH password login.

- name: Check Bottega SSH password fallback setting
  community.routeros.command:
    commands:
      - /ip ssh print
  register: _bottega_ssh_password_login
  changed_when: false

- name: Disable Bottega SSH password authentication
  community.routeros.command:
    commands:
      - /ip ssh set password-authentication=no
  when:
    - "'password-authentication:' in _bottega_ssh_password_login.stdout[0]"
    - >-
      'password-authentication: no' not in
      _bottega_ssh_password_login.stdout[0]

- name: Disable Bottega SSH always-allow password fallback
  community.routeros.command:
    commands:
      - /ip ssh set always-allow-password-login=no
  when:
    - "'always-allow-password-login:' in _bottega_ssh_password_login.stdout[0]"
    - >-
      'always-allow-password-login: no' not in
      _bottega_ssh_password_login.stdout[0]

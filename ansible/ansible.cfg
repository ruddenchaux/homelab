[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = root
private_key_file = ~/.ssh/id_ed25519
host_key_checking = false
retry_files_enabled = false

[privilege_escalation]
become = false

# RouterOS hosts use ansible.netcommon.network_cli, which falls back to paramiko
# when ansible-pylibssh is absent. At paramiko's default the fallback offers
# every key in ~/.ssh and can hand the passphrase prompt to ksshaskpass on a
# desktop session; network_cli surfaces the resulting failure only as the opaque
# "No existing session". This is the paramiko equivalent of the ssh flag that
# works by hand -- IdentitiesOnly=yes -- so the router connection depends on
# ansible_ssh_private_key_file alone. (host_key_auto_add is not needed:
# host_key_checking above already covers it.)
#
# ansible-core deprecates its own global alias for this key and warns on every
# run; the plugin option itself is not deprecated and has no inventory-var form,
# so this ini section is the only place it can be set.
[paramiko_connection]
look_for_keys = False
